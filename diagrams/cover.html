<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:562px;overflow:hidden;background:#1a0c10;
font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}
.frame{width:1000px;height:562px;position:relative;
background:
  radial-gradient(ellipse 70% 80% at 18% 50%, rgb(255 90 50 / .28), transparent 55%),
  radial-gradient(ellipse 50% 70% at 88% 20%, rgb(255 46 77 / .18), transparent 50%),
  linear-gradient(135deg,#2a1014 0%,#120508 45%,#1a0a0e 100%)}
.mark{
  position:absolute;left:72px;top:50%;translate:0 -50%;
  width:220px;height:220px;border-radius:48px;
  background:linear-gradient(160deg,#ff7a45,#e23a2e 55%,#b91c1c);
  box-shadow:0 24px 60px rgb(226 58 46 / .45), inset 0 1px 0 rgb(255 255 255 / .25);
  display:grid;place-items:center}
.mark svg{width:140px;height:140px}
.copy{position:absolute;left:340px;right:64px;top:50%;translate:0 -50%}
.kicker{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#ffb199;font-weight:700;margin-bottom:14px}
.copy h1{font-size:48px;line-height:1.08;letter-spacing:-.03em;font-weight:800;max-width:14ch}
.copy h1 span{color:#ff8a70}
.sub{margin-top:18px;font-size:18px;color:#f0cfc8;line-height:1.45;max-width:28ch}
.path{position:absolute;left:340px;bottom:48px;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c9a0a6}
.dot{width:8px;height:8px;border-radius:50%;background:#ff5468}
</style></head>
<body><div class="frame">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M8 32h16l6-14 8 28 6-14h12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="22" stroke="#fff" stroke-width="3" opacity=".35"/>
    </svg>
  </div>
  <div class="copy">
    <p class="kicker">Burp Suite · behind the scenes</p>
    <h1>How intercept <span>really</span> reads HTTPS</h1>
    <p class="sub">Not the click. The two locks, the stamp, and the plaintext in the middle.</p>
  </div>
  <div class="path"><span class="dot"></span> Browser → Burp → Server</div>
</div></body></html>
