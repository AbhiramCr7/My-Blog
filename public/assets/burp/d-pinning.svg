<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Pinning rejects Burp host certificates even if the CA is trusted">
<rect width="1000" height="300" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">CERTIFICATE PINNING VS CA TRUST</text><rect x="60" y="70" width="400" height="180" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="260.0" y="154.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Normal trust</text><text x="260.0" y="174.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signed by a trusted CA → accept</text><rect x="540" y="70" width="400" height="180" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="740.0" y="154.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">App pinning</text><text x="740.0" y="174.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">expected cert / public key / SPKI</text><text x="500" y="280" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">Application-level check. Trusted Burp CA is not enough if the pin misses.</text>
</svg>