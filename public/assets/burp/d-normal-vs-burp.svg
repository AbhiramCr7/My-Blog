e="#5a2a32" stroke-width="1.5"/><text x="560.0" y="298.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test</text><text x="560.0" y="318.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">real cert</text><line x1="560" y1="134" x2="560" y2="168" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="560" y1="238" x2="560" y2="272" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="590" y="158" text-anchor="start" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">TLS A</text><text x="590" y="262" text-anchor="start" fill="#7ee2a8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">TLS B</text><text x="560" y="52" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700">BURP</text><text x="500" y="360" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">No single Browser → shop.test TLS session once Burp terminates TLS.</text>
