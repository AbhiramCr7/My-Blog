<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Mutual TLS with Burp presenting a client certificate upstream">
<rect width="1000" height="280" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">MTLS: CLIENT CERTIFICATE ON THE UPSTREAM HOP</text><rect x="60" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="150.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Browser / client</text><rect x="410" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp</text><text x="500.0" y="134.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">client cert for origin</text><rect x="760" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="850.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">API</text><text x="850.0" y="134.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">requests client cert</text><line x1="240" y1="120" x2="410" y2="120" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="590" y1="120" x2="760" y2="120" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="210" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">Server proves itself with its cert. Client must also prove itself.</text><text x="500" y="238" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">Burp presents a configured PKCS#12 / PKCS#11 cert when the origin asks.</text>
</svg>