<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Twelve-step packet flow of HTTPS through Burp">
<rect width="1000" height="480" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">PACKET FLOW 1–12</text><rect x="40" y="48" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="65" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">1</text><text x="84" y="65" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">CONNECT shop.test:443</text><rect x="40" y="82" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="99" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">2</text><text x="84" y="99" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">200 Connection Established</text><rect x="40" y="116" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="133" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">3</text><text x="84" y="133" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">ClientHello + SNI (+ ALPN)</text><rect x="40" y="150" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="167" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">4</text><text x="84" y="167" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp per-host certificate (issuer = Burp CA)</text><rect x="40" y="184" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="201" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">5</text><text x="84" y="201" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">TLS handshake completes → session A</text><rect x="40" y="218" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="235" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">6</text><text x="84" y="235" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Encrypted HTTP request on A</text><rect x="40" y="252" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="269" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">7</text><text x="84" y="269" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp decrypts to HTTP</text><rect x="40" y="286" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="303" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">8</text><text x="84" y="303" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Forward over new TLS session B</text><rect x="40" y="320" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="337" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">9</text><text x="84" y="337" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Origin HTTP response on B</text><rect x="40" y="354" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="371" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">10</text><text x="84" y="371" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp decrypts response</text><rect x="40" y="388" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="405" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">11</text><text x="84" y="405" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Re-encrypt on session A</text><rect x="40" y="422" width="28" height="24" rx="12" fill="#ff5468"/><text x="54" y="439" text-anchor="middle" fill="#fff" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">12</text><text x="84" y="439" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Browser consumes the response</text>
</svg>