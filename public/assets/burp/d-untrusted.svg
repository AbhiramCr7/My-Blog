<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Trusted Burp CA versus untrusted attacker CA">
<rect width="1000" height="340" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">WHY A RANDOM ATTACKER CANNOT MITM HTTPS</text><rect x="80" y="70" width="380" height="180" rx="12" fill="#241014" stroke="#7ee2a8" stroke-width="2"/><text x="270.0" y="154.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp CA trusted</text><text x="270.0" y="174.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signs shop.test leaf → browser accepts</text><rect x="540" y="70" width="380" height="180" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="730.0" y="154.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Attacker CA not trusted</text><text x="730.0" y="174.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">same shape of cert → validation fails</text><text x="270" y="280" text-anchor="middle" fill="#7ee2a8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">CA in trust store</text><text x="730" y="280" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">certificate validation failure</text><text x="500" y="320" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">Burp works because you explicitly trust Burp’s CA - not because the leaf “looks real.”</text>
</svg>