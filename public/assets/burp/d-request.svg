<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Numbered request path from CONNECT to upstream TLS">
<rect width="1000" height="520" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">REQUEST LIFECYCLE</text><rect x="40" y="50" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="70" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">1</text><text x="92" y="70" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Browser opens TCP to 127.0.0.1:8080</text><rect x="40" y="88" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="108" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">2</text><text x="92" y="108" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">CONNECT shop.test:443 HTTP/1.1</text><rect x="40" y="126" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="146" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">3</text><text x="92" y="146" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp: 200 Connection Established</text><rect x="40" y="164" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="184" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">4</text><text x="92" y="184" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">ClientHello (SNI if present, ALPN…)</text><rect x="40" y="202" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="222" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">5</text><text x="92" y="222" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp presents per-host cert signed by Burp CA</text><rect x="40" y="240" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="260" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">6</text><text x="92" y="260" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Browser validates chain → TLS connection A</text><rect x="40" y="278" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="298" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">7</text><text x="92" y="298" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Encrypted HTTP on connection A</text><rect x="40" y="316" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="336" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">8</text><text x="92" y="336" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp terminates A - HTTP plaintext in memory</text><rect x="40" y="354" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="374" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">9</text><text x="92" y="374" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Inspect / modify / intercept pause</text><rect x="40" y="392" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="412" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">10</text><text x="92" y="412" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Burp opens TLS connection B to shop.test</text><rect x="40" y="430" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="450" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">11</text><text x="92" y="450" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Encrypted HTTP on connection B</text><rect x="40" y="468" width="36" height="28" rx="14" fill="#ff5468"/><text x="58" y="488" text-anchor="middle" fill="#fff" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">12</text><text x="92" y="488" fill="#ffe8ea" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">Origin processes the request</text>
</svg>