<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Conceptual Browser to Burp TLS handshake on session A">
<rect width="1000" height="420" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">CONCEPTUAL TLS HANDSHAKE - SIMPLIFIED</text><text x="180" y="70" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">Browser</text><text x="820" y="70" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">Burp</text><line x1="260" y1="110" x2="740" y2="110" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="100" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">ClientHello   SNI=shop.test (if present)   ALPN=h2,http/1.1</text><line x1="740" y1="155" x2="260" y2="155" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="145" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">ServerHello</text><line x1="740" y1="200" x2="260" y2="200" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="190" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Certificate - Burp-generated leaf for shop.test</text><line x1="740" y1="245" x2="260" y2="245" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="235" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">key-exchange data  (conceptual; 1.2 vs 1.3 differ)</text><line x1="260" y1="290" x2="740" y2="290" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="280" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Finished</text><line x1="260" y1="345" x2="740" y2="345" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="335" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">encrypted HTTP  (connection A traffic keys)</text><text x="500" y="390" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">Conceptual only. Connection B is a separate handshake with the origin.</text>
</svg>