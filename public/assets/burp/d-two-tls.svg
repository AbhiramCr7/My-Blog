</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">TWO INDEPENDENT TLS SESSIONS</text><rect x="40" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="130.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Browser</text><rect x="410" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp Proxy</text><text x="500.0" y="134.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">terminates + originates</text><rect x="780" y="80" width="180" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="870.0" y="114.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test</text><line x1="220" y1="110" x2="410" y2="110" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="590" y1="110" x2="780" y2="110" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="315" y="98" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">TLS SESSION A</text><text x="315" y="142" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">Burp-generated host cert</text><text x="685" y="98" text-anchor="middle" fill="#7ee2a8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">TLS SESSION B</text><text x="685" y="142" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">real shop.test cert</text><rect x="250" y="210" width="500" height="150" rx="14" fill="#241014" stroke="#ff5468" stroke-width="1.5"/><text x="500" y="240" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">HTTP plaintext  ·  only here</text><text x="500" y="268" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">inspect  ·  modify  ·  intercept pause  ·  history</text><text x="500" y="300" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Browser never holds connection B. Server never holds connection A.</text><text x="500" y="328" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Burp does not decrypt shop.test’s original end-to-end session.</text><line x1="500" y1="160" x2="500" y2="210" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/>
