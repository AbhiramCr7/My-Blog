<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="CONNECT then TLS ClientHello with SNI then Burp host certificate">
<rect width="1000" height="360" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">BEFORE TLS: CONNECT THEN HANDSHAKE</text><rect x="60" y="80" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="160.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">1. TCP to :8080</text><rect x="400" y="80" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">2. CONNECT</text><text x="500.0" y="129.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">shop.test:443</text><rect x="740" y="80" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="840.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">3. 200 Established</text><line x1="260" y1="115" x2="400" y2="115" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="600" y1="115" x2="740" y2="115" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="220" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="160.0" y="249.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">4. ClientHello</text><text x="160.0" y="269.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SNI = shop.test</text><rect x="400" y="220" width="200" height="70" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="249.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">5. Host cert</text><text x="500.0" y="269.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signed by Burp CA</text><rect x="740" y="220" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="840.0" y="249.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">6. TLS A up</text><text x="840.0" y="269.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">session keys A</text><line x1="260" y1="255" x2="400" y2="255" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="600" y1="255" x2="740" y2="255" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="340" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">CONNECT names the hop. SNI names the cert. Cert is not sent before the destination is known.</text>
</svg>