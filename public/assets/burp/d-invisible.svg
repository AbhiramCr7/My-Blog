<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Non-proxy-aware client connects directly to an invisible Burp listener">
<rect width="1000" height="300" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">INVISIBLE PROXYING — NO CONNECT</text><rect x="40" y="70" width="200" height="90" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="140.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Thick client</text><text x="140.0" y="129.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">not proxy-aware</text><rect x="400" y="70" width="200" height="90" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp listener</text><text x="500.0" y="129.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">invisible mode</text><rect x="760" y="70" width="200" height="90" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="860.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Origin</text><line x1="240" y1="115" x2="400" y2="115" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="600" y1="115" x2="760" y2="115" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="200" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">DNS/hosts points the name at Burp. TLS starts immediately. Hostname from SNI or Host.</text><text x="500" y="228" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="400">No CONNECT. Destination for outbound must not loop back to the same listener.</text>
</svg>