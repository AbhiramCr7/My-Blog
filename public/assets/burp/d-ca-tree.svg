<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Burp CA signs per-host certificates for each destination">
<rect width="1000" height="340" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">ONE INSTALLATION CA, MANY PER-HOST CERTIFICATES</text><rect x="400" y="50" width="200" height="70" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="79.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp CA</text><text x="500.0" y="99.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">self-signed, once per install</text><line x1="500" y1="120" x2="170" y2="180" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="500" y1="120" x2="500" y2="180" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="500" y1="120" x2="830" y2="180" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="70" y="180" width="200" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="170.0" y="214.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test cert</text><text x="170.0" y="234.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SAN = shop.test</text><rect x="400" y="180" width="200" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="214.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">api.shop.test</text><text x="500.0" y="234.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SAN = api.shop.test</text><rect x="730" y="180" width="200" height="80" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="830.0" y="214.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">auth.shop.test</text><text x="830.0" y="234.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SAN = auth.shop.test</text><text x="500" y="300" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400">The CA is the signer. The host certificate is not the CA.</text>
</svg>