<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Full Burp HTTPS interception architecture with two independent TLS sessions">
<rect width="1000" height="620" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">HTTPS INTERCEPTION</text><rect x="40" y="70" width="160" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="120.0" y="99.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Browser</text><text x="120" y="158" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">1. CONNECT shop.test:443</text><line x1="120" y1="140" x2="120" y2="200" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="280" y="55" width="440" height="500" rx="16" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500" y="84" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">BURP PROXY</text><text x="500" y="108" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">explicit HTTP proxy  ·  listener</text><rect x="340" y="130" width="320" height="52" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="150.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp CA signs shop.test leaf</text><rect x="340" y="200" width="320" height="52" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="220.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">2. TLS session A  (browser)</text><rect x="340" y="272" width="320" height="52" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="292.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">3. HTTP plaintext here</text><rect x="340" y="344" width="320" height="52" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="364.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">4. TLS session B  (origin)</text><text x="500" y="430" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Session A ≠ Session B</text><text x="500" y="456" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Has: Burp CA key, interception certs, HTTP between hops</text><text x="500" y="478" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Does not have: origin private key, original end-to-end TLS secrets</text><text x="500" y="510" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Browser trusts Burp because Burp CA is in the trust store.</text><text x="500" y="532" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Burp does not need shop.test’s private key.</text><line x1="200" y1="250" x2="280" y2="250" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="720" y1="370" x2="820" y2="370" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="800" y="335" width="160" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="880.0" y="364.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test</text><text x="880" y="430" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">real certificate</text><text x="880" y="448" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">real private key</text>
</svg>