<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Full Burp HTTPS interception architecture with two TLS sessions">
<rect width="1000" height="560" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">MASTER ARCHITECTURE</text><rect x="40" y="70" width="160" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="120.0" y="99.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Browser</text><text x="120" y="160" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">CONNECT shop.test:443</text><line x1="120" y1="140" x2="120" y2="190" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="60" width="400" height="430" rx="16" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500" y="90" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">BURP SUITE</text><text x="500" y="114" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Proxy listener  ·  127.0.0.1:8080</text><rect x="360" y="140" width="280" height="50" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="159.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp CA  →  per-host cert</text><rect x="360" y="210" width="280" height="50" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="229.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">TLS session A  (browser)</text><rect x="360" y="280" width="280" height="50" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="500.0" y="299.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">HTTP plaintext  inspect/modify</text><rect x="360" y="350" width="280" height="50" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="500.0" y="369.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">TLS session B  (upstream)</text><text x="500" y="430" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Does not hold shop.test private key</text><text x="500" y="454" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">Browser validates host cert  ·  Burp validates origin cert</text><line x1="120" y1="250" x2="300" y2="250" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><line x1="700" y1="375" x2="820" y2="375" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="800" y="340" width="160" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="880.0" y="369.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test</text><text x="880" y="430" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">real certificate</text><text x="880" y="448" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400">real private key</text>
</svg>