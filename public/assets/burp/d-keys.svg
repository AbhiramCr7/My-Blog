<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="CA key, per-host key, TLS session keys, origin private key stays on server">
<rect width="1000" height="300" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">WHICH KEYS ARE INVOLVED</text><rect x="40" y="70" width="220" height="160" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="150.0" y="144.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">CA private key</text><text x="150.0" y="164.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signs host certs</text><rect x="280" y="70" width="220" height="160" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="390.0" y="144.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Host key pair</text><text x="390.0" y="164.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">TLS server to browser</text><rect x="520" y="70" width="220" height="160" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="630.0" y="144.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Traffic keys A / B</text><text x="630.0" y="164.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">derived per hop</text><rect x="760" y="70" width="200" height="160" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="860.0" y="144.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test key</text><text x="860.0" y="164.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">never in Burp</text><text x="500" y="270" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="400">Burp does not possess the origin server’s private key.</text>
</svg>