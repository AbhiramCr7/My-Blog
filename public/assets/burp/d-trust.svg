<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Browser trusts Burp CA; Burp validates the real server certificate">
<rect width="1000" height="360" fill="#14060a"/>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#ff5468"/>
  </marker>
</defs><text x="500" y="28" text-anchor="middle" fill="#ff5468" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">TWO SEPARATE TRUST RELATIONSHIPS</text><rect x="80" y="80" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="180.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Browser</text><line x1="180" y1="150" x2="180" y2="200" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="300" y="180" text-anchor="start" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">validates hostname, chain, signature, trust anchor</text><rect x="80" y="200" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="180.0" y="229.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Host cert</text><text x="180.0" y="249.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">issuer = Burp CA</text><line x1="180" y1="270" x2="180" y2="300" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="80" y="300" width="200" height="50" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="180.0" y="319.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Trust store</text><text x="180.0" y="339.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Burp CA installed</text><rect x="560" y="80" width="200" height="70" rx="12" fill="#241014" stroke="#ff5468" stroke-width="2"/><text x="660.0" y="109.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Burp</text><line x1="660" y1="150" x2="660" y2="200" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><text x="780" y="180" text-anchor="start" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400">validates upstream cert (configurable)</text><rect x="560" y="200" width="200" height="70" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="660.0" y="229.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">Real cert</text><text x="660.0" y="249.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">public CA / private PKI</text><line x1="660" y1="270" x2="660" y2="300" stroke="#ff5468" stroke-width="2" marker-end="url(#ah)"/><rect x="560" y="300" width="200" height="50" rx="12" fill="#241014" stroke="#5a2a32" stroke-width="1.5"/><text x="660.0" y="319.0" text-anchor="middle" fill="#ffe8ea" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700">shop.test</text><text x="660.0" y="339.0" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">server private key stays here</text><text x="500" y="48" text-anchor="middle" fill="#c9a0a6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="1" font-weight="400"></text>
</svg>